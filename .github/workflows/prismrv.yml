name: prismrv-driver-build

# Build the PrismRV DRM driver against a recent vanilla kernel to catch
# API drift and compile errors early.  The full arm64/arm zImage build
# stays local (too heavy for CI); here we only need the driver object.

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev/v7.1/prismrv-drm'
    paths:
      - 'drivers/gpu/drm/prismrv/**'
      - 'include/uapi/drm/prismrv_drm.h'
      - '.github/workflows/prismrv.yml'
  pull_request:
    branches:
      - 'dev/v7.1/prismrv-drm'

permissions:
  contents: read

concurrency:
  group: prismrv-kbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kbuild-vanilla:
    name: build vs ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # latest LTS + previous LTS: catches API drift both ways
        kernel: ['6.12', '6.6']
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libelf-dev libssl-dev llvm clang lld \
            gcc-arm-linux-gnueabihf
          # the driver targets ARM SoCs: build against an arm multi_v7
          # config so OF/MMU dependencies resolve naturally

      - name: Fetch vanilla kernel
        run: |
          KVER=${{ matrix.kernel }}
          curl -sL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KVER}.tar.xz" -o /tmp/k.tar.xz
          mkdir /tmp/ksrc
          tar xJf /tmp/k.tar.xz -C /tmp/ksrc --strip-components=1
          echo "KSRCDIR=/tmp/ksrc" >> "$GITHUB_ENV"

      - name: Drop in the prismrv driver
        run: |
          test ! -e "$KSRCDIR/drivers/gpu/drm/prismrv"
          cp -r drivers/gpu/drm/prismrv "$KSRCDIR/drivers/gpu/drm/"
          grep -q prismrv "$KSRCDIR/drivers/gpu/drm/Makefile" ||             echo 'obj-$(CONFIG_DRM_PRISMRV) += prismrv/' \
              >> "$KSRCDIR/drivers/gpu/drm/Makefile"
          grep -q 'source "drivers/gpu/drm/prismrv/Kconfig"' \
            "$KSRCDIR/drivers/gpu/drm/Kconfig" ||             sed -i '1isource "drivers/gpu/drm/prismrv/Kconfig"' \
              "$KSRCDIR/drivers/gpu/drm/Kconfig"

      - name: Configure kernel (arm multi_v7, the real target)
        run: |
          cat > /tmp/prismrv.config <<'FRAG'
          # dependency order matters: merge_config drops symbols whose
          # dependencies are not yet resolved, so enable from the top
          CONFIG_ARCH_MULTIPLATFORM=y
          CONFIG_ARCH_MULTI_V6_V7=y
          CONFIG_ARCH_MULTI_V7=y
          CONFIG_ARCH_MEDIATEK=y
          CONFIG_MACH_MT6589=y
          CONFIG_DRM=y
          CONFIG_DRM_GEM_SHMEM_HELPER=y
          CONFIG_PM_DEVFREQ=y
          CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y
          CONFIG_PM_OPP=y
          CONFIG_DRM_PRISMRV=m
          FRAG
          make -C "$KSRCDIR" ARCH=arm LLVM=1 multi_v7_defconfig
          ./scripts/kconfig/merge_config.sh -m "$KSRCDIR/.config" /tmp/prismrv.config
          make -C "$KSRCDIR" ARCH=arm LLVM=1 olddefconfig
          grep -q 'CONFIG_DRM_PRISMRV=m' "$KSRCDIR/.config" || {
            echo "::error::CONFIG_DRM_PRISMRV not set"
            grep -E 'CONFIG_(ARCH_|MACH_MT|DRM)' "$KSRCDIR/.config" | head -20
            exit 1; }
          grep -q 'CONFIG_ARCH_MEDIATEK=y' "$KSRCDIR/.config" || {
            echo "::error::ARCH_MEDIATEK did not stick"; exit 1; }
          make -C "$KSRCDIR" ARCH=arm LLVM=1 -j$(nproc) prepare modules_prepare

      - name: Build driver (clang)
        run: |
          make -C "$KSRCDIR" ARCH=arm LLVM=1 M=drivers/gpu/drm/prismrv -j$(nproc) \
            modules 2>&1 | tee build.log
          test -f "$KSRCDIR/drivers/gpu/drm/prismrv/prismrv.ko" || {
            echo "::error::prismrv.ko was not produced"; exit 1; }
          if grep -E 'warning:' build.log; then
            echo "::error::warnings present (project policy treats them as errors)"
            exit 1
          fi

      - name: Check uapi header installs cleanly
        run: |
          mkdir -p /tmp/uapi
          install -D include/uapi/drm/prismrv_drm.h \
            /tmp/uapi/drm/prismrv_drm.h
          gcc -fsyntax-only -I/tmp/uapi -x c - <<'EOF'
          #include <drm/prismrv_drm.h>
          int main(void) { return PRISMRV_UAPI_VERSION == 1 ? 0 : 1; }
          EOF
