%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/mediatek/mediatek,mmsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek mmsys controller

maintainers:
  - Matthias Brugger <matthias.bgg@gmail.com>

description:
  The MediaTek mmsys system controller provides clock control, routing control,
  and miscellaneous control in mmsys partition.

  The display hardware is a crossbar: components such as OVL, BLS, RDMA and
  DSI each have several possible inputs and outputs, and a set of registers
  selects which of them are connected.  mediatek,display-path names the
  components of one display pipeline in order, and mediatek,display-routes
  gives the register settings that wire its consecutive pairs together.  The
  two are read by one driver because they are one decision.

properties:
  $nodename:
    pattern: "^syscon@[0-9a-f]+$"

  compatible:
    oneOf:
      - items:
          - enum:
              - mediatek,mt2701-mmsys
              - mediatek,mt2712-mmsys
              - mediatek,mt6589-dispsys
              - mediatek,mt6765-mmsys
              - mediatek,mt6779-mmsys
              - mediatek,mt6795-mmsys
              - mediatek,mt6797-mmsys
              - mediatek,mt8167-mmsys
              - mediatek,mt8173-mmsys
              - mediatek,mt8183-mmsys
              - mediatek,mt8186-mmsys
              - mediatek,mt8188-vdosys0
              - mediatek,mt8188-vdosys1
              - mediatek,mt8188-vppsys0
              - mediatek,mt8188-vppsys1
              - mediatek,mt8192-mmsys
              - mediatek,mt8195-vdosys1
              - mediatek,mt8195-vppsys0
              - mediatek,mt8195-vppsys1
              - mediatek,mt8365-mmsys
          - const: syscon

      - description: vdosys0 and vdosys1 are 2 display HW pipelines,
                     so mt8195 binding should be deprecated.
        deprecated: true
        items:
          - const: mediatek,mt8195-mmsys
          - const: syscon

      - items:
          - const: mediatek,mt7623-mmsys
          - const: mediatek,mt2701-mmsys
          - const: syscon

      - items:
          - const: mediatek,mt8195-vdosys0
          - const: mediatek,mt8195-mmsys
          - const: syscon

  reg:
    maxItems: 1

  power-domains:
    description:
      A phandle and PM domain specifier as defined by bindings
      of the power controller specified by phandle. See
      Documentation/devicetree/bindings/power/power-domain.yaml for details.

  mboxes:
    description:
      Using mailbox to communicate with GCE, it should have this
      property and list of phandle, mailbox specifiers. See
      Documentation/devicetree/bindings/mailbox/mediatek,gce-mailbox.yaml
      for details.
    $ref: /schemas/types.yaml#/definitions/phandle-array

  mediatek,gce-client-reg:
    description:
      The register of client driver can be configured by gce with 4 arguments
      defined in this property, such as phandle of gce, subsys id,
      register offset and size.
      Each subsys id is mapping to a base address of display function blocks
      register which is defined in the gce header
      include/dt-bindings/gce/<chip>-gce.h.
    $ref: /schemas/types.yaml#/definitions/phandle-array
    maxItems: 1

  "#clock-cells":
    const: 1

  '#reset-cells':
    const: 1

  mediatek,display-path:
    description:
      A display pipeline, as a list of component names in the order the
      pipeline runs.  Every component named here must exist and be enabled,
      or no CRTC is created for the pipeline.

      This property programs no register by itself; it describes the pipeline
      that mediatek,display-routes then wires up.

    $ref: /schemas/types.yaml#/definitions/string-list

  mediatek,display-routes:
    description:
      The crossbar settings for the display pipeline, as a list of
      "<from> <to> <offset> <mask> <value>" strings, where from and to are
      component names as used in mediatek,display-path and offset is a byte
      offset into the mmsys register block.

      A connection may need more than one entry, for example when it needs both
      an output-port enable and an input selector.  All entries matching a pair
      are applied.

      An offset of 0 means the pair is a fixed link, wired together in hardware
      with no register to program.  It is written this way rather than left out
      so that fixed links are stated instead of merely absent.

      A pair that mediatek,display-path connects but that is missing here
      fails: the CRTC is not enabled and the missing pair is reported, rather
      than the display silently showing nothing.  Entries naming blocks with no
      driver are allowed and simply unused.

    $ref: /schemas/types.yaml#/definitions/string-list

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description:
      Output port node. This port connects the MMSYS/VDOSYS output to
      the first component of one display pipeline, for example one of
      the available OVL or RDMA blocks.
      Some MediaTek SoCs support multiple display outputs per MMSYS.
    properties:
      endpoint@0:
        $ref: /schemas/graph.yaml#/properties/endpoint
        description: Output to the primary display pipeline

      endpoint@1:
        $ref: /schemas/graph.yaml#/properties/endpoint
        description: Output to the secondary display pipeline

      endpoint@2:
        $ref: /schemas/graph.yaml#/properties/endpoint
        description: Output to the tertiary display pipeline

    anyOf:
      - required:
          - endpoint@0
      - required:
          - endpoint@1
      - required:
          - endpoint@2

required:
  - compatible
  - reg
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/power/mt8173-power.h>
    #include <dt-bindings/gce/mt8173-gce.h>

    mmsys: syscon@14000000 {
        compatible = "mediatek,mt8173-mmsys", "syscon";
        reg = <0x14000000 0x1000>;
        power-domains = <&spm MT8173_POWER_DOMAIN_MM>;
        #clock-cells = <1>;
        #reset-cells = <1>;
        mboxes = <&gce 0 CMDQ_THR_PRIO_HIGHEST>,
                 <&gce 1 CMDQ_THR_PRIO_HIGHEST>;
        mediatek,gce-client-reg = <&gce SUBSYS_1400XXXX 0 0x1000>;
    };
