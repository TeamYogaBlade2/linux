%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/onnn,a5142.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ON Semiconductor A5142 MIPI CSI-2 sensor

maintainers:
  - Akari Tsuyukusa <akkun11.open@gmail.com>

description: |
  The A5142 is an ON Semiconductor (Aptina) 5 megapixel raw CMOS image
  sensor with a MIPI CSI-2 output and an I2C control interface.  It is the
  main camera of the Lenovo YOGA Tablet 8/10 (MT6589).

  Registers are 16-bit addressed.  Most of the vendor's register sequence
  writes 16-bit data and a small part of it writes 8-bit data, so the
  driver carries the transfer width per register rather than assuming one.

  The part has no internal autofocus; the FM50AF voice coil motor is a
  separate I2C device on the same camera module.

properties:
  compatible:
    const: onnn,a5142

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: extclk

  vdd-supply:
    description:
      Digital core supply.  On the Lenovo YOGA Tablet this is the rail the
      vendor calls VCAMD, wired to MT6320 VGP1.

  vddio-supply:
    description:
      I/O supply, the vendor's VCAMIO.

  reset-gpios:
    description: Reset line, active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false
    description: |
      Video output port.

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            const: 4
          data-lanes:
            description:
              The vendor register tables program two lanes
              (0x31AE = 0x0202), so exactly two are valid here.
            items:
              - const: 1
              - const: 2
          link-frequencies: true

        required:
          - bus-type
          - data-lanes

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - vdd-supply
  - vddio-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@6c {
            compatible = "onnn,a5142";
            reg = <0x6c>;

            clocks = <&camclk 0>;
            clock-names = "extclk";

            vdd-supply = <&cam_2v8>;
            vddio-supply = <&cam_1v8>;

            reset-gpios = <&pio 211 GPIO_ACTIVE_LOW>;

            port {
                a5142_out: endpoint {
                    remote-endpoint = <&csi2_in>;
                    bus-type = <4>;
                    data-lanes = <1 2>;
                };
            };
        };
    };
...
