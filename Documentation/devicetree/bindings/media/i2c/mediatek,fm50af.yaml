%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/mediatek,fm50af.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FM50AF voice coil motor

maintainers:
  - Akari Tsuyukusa <akkun11.open@gmail.com>

description: |
  The FM50AF is a 10-bit DAC driving a camera lens voice coil motor, used
  for autofocus.  It has no register address: an I2C transfer carries the
  DAC value directly.

properties:
  compatible:
    const: mediatek,fm50af

  reg:
    maxItems: 1

  powerdown-gpios:
    maxItems: 1
    description:
      Optional power-down line.  The FM50AF on the Lenovo B8000 does not
      use one; the actuator is powered whenever its rail is up.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        lens@18 {
            compatible = "mediatek,fm50af";
            reg = <0x18>;
        };
    };
