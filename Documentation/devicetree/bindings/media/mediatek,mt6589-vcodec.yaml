%YAML 1.2
---
$id: http://devicetree.org/schemas/mediatek,mt6589-vcodec.yaml#
$schema: http://devicetree.org/schemas/bindings.yaml#

title: MediaTek MT6589 Video Codec (VENC and VDEC)

description: |
  The MT6589 video codec is a hardwired RTL accelerator with two register
  blocks: an H.264/VP8 video encoder (VENC) and a multi-standard video decoder
  (VDEC).  Unlike the later MediaTek VPU/IPI generations there is no
  coprocessor and no firmware: both blocks are programmed through MMIO, and
  power is a plain clock gate in the VEN and VDE power domains.

  This binding describes a single node covering both blocks, mirroring the
  vendor topology where one device serves both the encoder and the decoder.

  DRAFT DRIVER - SCOPE OF WHAT ACTUALLY WORKS
  ------------------------------------------
  This driver is a resource layer plus a partial H.264 encode front end.  Read
  this before assuming a conformant codec is present.

  What it does do:

  - Probes the two register windows, the three clocks and the two IRQ lines.
  - Brings both engines out of reset and gates their clocks through runtime
    PM, and serialises the per-engine operations with a mutex.
  - Programs the chapter-60 H.264 datapath: the bitstream, source, reference
    and reconstruction address registers, and the quantiser triple, target bit
    rate, CBR/initial-QP mode bits, frame rate and P/B QP adjust limiters,
    rejecting quantisers outside the documented 0..51 range.
  - Allocates and owns the bitstream, reference, reconstruction and rate
    control scratch buffers those address registers need.
  - Acknowledges the encoder frame-done interrupt, handles a bitstream-buffer
    overflow, and reports the coded bitstream length; a watchdog
    (MTK_VENC_TIMEOUT_MS) retires a frame the hardware never completes, so a
    wedged engine cannot pin a clock reference forever.
  - Exposes the H.264 datapath as one V4L2 memory-to-memory codec node (NV12
    in, bitstream out).
  - Registers a second V4L2 memory-to-memory node for the decoder (bitstream
    in, NV12 out).  The node is real and supports capability query and format
    negotiation, but its device_run() reports -ENODEV: see "Decode" below.
    It exists so that a decoder client can discover the block and be told
    plainly that it cannot use it, rather than finding no node at all.

  What it does NOT do:

  - Decode.  The VDEC window is mapped, its clock is gated and its frame-end
    interrupt is acknowledged, but the decoder datapath is not programmed at
    all.  This is architectural, not an omission: the vendor stack programs
    the decoder from userspace, not from the kernel.  Its kernel driver
    touches the block only to power it up and acknowledge the frame-end
    interrupt, while the register sequence itself is shipped to it as a queue
    of WRITE_REG_CMD records that closed userspace libraries assemble and pass
    over the MFV_SET_CMD_CMD ioctl, and the driver merely walks that queue.
    The decode sequence therefore lives in stripped, partly encrypted ARM
    blobs.  Two further obstacles are documented in the driver's register
    header: the only readable register map is the vendor LDVT register-test
    harness, which is configured for MT8580 rather than MT6589, and VP8
    additionally requires its probability tables pushed bit-by-bit into parser
    SRAM before any frame can decode.  Userspace of this driver must not expect
    a decoded picture.
  - Conformant bitstreams.  Entropy coding, motion estimation and the
    coefficient buffer exist only in the vendor's closed userspace libraries
    and were not ported, and the bitrate algorithm behind the RC registers is
    the vendor's.  The registers are programmed; the codec is not implemented.
    Userspace must treat the output as opaque.
  - Slice control (a frame larger than one MB row is never split into slices),
    and SPS/PPS emission (no parameter-set buffer is allocated).
  - MPEG-4 encoding: its address programming and interrupt exist, but the three
    chroma planes and the per-MB side-information buffer at VENC_MP4_SIDE_ADDR
    are not allocated, so a submit is rejected with -ENODEV.
  - VP8 beyond what mtk_venc_bitstream_size() restricts it to.

  There is no hardware to test against, so none of this is claimed to work end
  to end.

  Note on power-domains: the property is accepted and described below, but the
  driver as it stands does not itself call dev_pm_domain_get() or run the SCM
  power-on sequence.  A node providing them is not wrong - the clocks are taken
  through them by the clock driver - but do not read the driver's presence as
  evidence that it drives the domains itself.

maintainers:
  - Akari Tsuyukusa <akkun11.open@gmail.com>

properties:
  compatible:
    oneOf:
      - items:
          - const: mediatek,mt6589-vcodec

  reg:
    minItems: 2
    maxItems: 2
    description: |
      Two register windows, in order: the encoder followed by the decoder.

      The encoder is 4 KiB at 0x17002000 and is documented twice over: data
      sheet chapter 60 (H.264 and VP8) and chapter 61 (MPEG-4), the latter
      starting at offset 0x600 inside the same window.

      The decoder is 0x29000 bytes at 0x16020000, itself split into a MISC
      block at offset 0 and a VLD (bitstream parser) block at offset 0x1000.
      Note this is 0x16020000 and NOT 0x16000000, which is the vdecsys clock
      controller.  It comes from the stock mt_reg_base.h VDEC_BASE 0xF6020000
      after the +0xE0000000 remap.  The data sheet contains no register
      definition for the decoder at all, so a binding cannot describe its
      register layout.

  interrupts:
    minItems: 2
    maxItems: 2
    description: |
      Two interrupt lines, in order: the encoder followed by the decoder.
      The two are wired with opposite polarity: the encoder interrupt is
      asserted low and the decoder interrupt is asserted high, so the DT must
      use IRQ_TYPE_LEVEL_LOW for the first and IRQ_TYPE_LEVEL_HIGH for the
      second.  Using one polarity for both will silently never fire.

  clocks:
    minItems: 3
    maxItems: 3
    description: |
      Three clock gates, in order: the encoder engine, the decoder engine and
      the decoder SMI (LARB) clock.  clock-names is required because the
      encoder clock comes from the vencsys provider and the two decoder
      clocks from vdecsys, and each provider numbers its own gates from zero,
      so the provider-local clock ids overlap and are not a unique key.

  clock-names:
    items:
      - const: venc
      - const: vdec-vde
      - const: vdec-smi

  power-domains:
    minItems: 2
    maxItems: 2
    description: |
      The encoder and decoder power domains, VEN and VDE, in that order.
      Both are powered off at reset and require the SCM power-on sequence.

  iommus:
    minItems: 1
    items:
      description: M4U port for a codec DMA engine.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains

additionalProperties: false
