%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt6589-g2d.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6589 2D Accelerator (G2D)

maintainers:
  - Akari Tsuyukusa <akkun11.open@gmail.com>

description: >
  MT6589 contains a 2D graphics accelerator, G2D, that is a separate engine
  from the display pipeline. It has its own MMIO block, its own interrupt, its
  own clock gates, its own DMA master, and its own M4U (IOMMU) port, and it can
  copy or fill rectangles between buffers.

  The block moves pixels between two memory buffers and has nothing to do with
  the display pipeline, so it is a V4L2 memory-to-memory device: a /dev/videoN
  node with an OUTPUT queue (the surface it reads) and a CAPTURE queue (the one
  it writes).  Buffers reach it as dma-buf fds, imported per queue, so the
  addresses it is programmed with are mapped through its own M4U port.  The
  rectangle is described with the standard V4L2 selection API and a fill is the
  same queue pair with a zero-sized COMPOSE selection, so no driver-private
  userspace interface is defined.

  It is not a child of the display subsystem in the bindings sense either: it
  has its own MMIO block, interrupt and clock gates, and the only thing it
  shares with the display blocks is the power domain.

properties:
  compatible:
    enum:
      - mediatek,mt6589-g2d

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - g2d-engine
      - g2d-smi

  power-domains:
    maxItems: 1

  iommus:
    description: >
      M4U port for the G2D engine's SRC, W2M and DST address registers.
      G2D is a DMA client with its own address registers, so it needs its
      own translation: a dma-buf imported on either queue is mapped through
      this device, and the resulting IOVA is what gets programmed.  The
      driver cannot work without it, because the address it writes into
      SRC_ADDR/W2M_ADDR is meaningful only to the page table of the port
      that produced it.
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - iommus

additionalProperties: false

examples:
  - |
    g2d: g2d@14013000 {
        compatible = "mediatek,mt6589-g2d";
        reg = <0x14013000 0x1000>;
        interrupts = <GIC_SPI 177 IRQ_TYPE_LEVEL_LOW>;
        clocks = <&dispsys CLK_DISP0_G2D_ENGINE>,
                 <&dispsys CLK_DISP0_G2D_SMI>;
        clock-names = "g2d-engine", "g2d-smi";
        iommus = <&iommu MT6589_M4U_PORT_G2D>;
        power-domains = <&spm MT6589_POWER_DOMAIN_DIS>;
        status = "okay";
    };
