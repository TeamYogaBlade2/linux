%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/mediatek,mt6589-mipi-csi-dphy.yaml#
$schema: http://devicetree.org/schemas/base.yaml#

title: Mediatek MT6589 MIPI CSI-2 D-PHY

maintainers:
  - Lenovo Linux Team

description:
  The MT6589 sensor front end contains two MIPI CSI-2 D-PHY receivers
  below the SENINF CSI-2 receivers:

    CSI0  DVDD18_MIPIRX  a 4-lane D-PHY (RD0..RD3 plus RCK)
    CSI1  DVDD18_MIPIIO  a 1-lane interface

  This binding follows the DT contract of the in-tree MT8365 SENINF PHY
  (mediatek,mt8365-csi-rx) so that a single consumer works with either:
  the number of lanes is given by num-lanes, and the operating mode is
  either carried in the PHY cells (#phy-cells = <1>) or by the phy-type
  property (#phy-cells = <0>).  The MT6589 has no C-PHY, so only
  PHY_TYPE_DPHY is valid.

  mediatek,mipi-csi-port is MT6589-specific and selects which of the two
  PHYs the node describes.

  WARNING: the driver behind this binding is a stub.  The register map of
  the MT6589 MIPI RX PHY is not documented in the MT6589 data sheet, so
  power_on() does not program the analogue block and no video will be
  produced.  The node exists so the graph is complete and the failure is
  visible as dead video rather than as writes to unknown registers.

properties:
  compatible:
    const: mediatek,mt6589-mipi-csi-dphy

  reg:
    description:
      Register window of the D-PHY.

      Placeholder.  The address in the example below is the sensor front
      end window that contains the seninf/csi2/SCAM registers, which is
      known to be a valid aperture, but it is NOT known to be where the
      PHY registers live.  Must be corrected before this node is relied
      on.
    maxItems: 1

  mediatek,mipi-csi-port:
    description:
      Which D-PHY this is.  Optional.

      0 selects the 4-lane CSI0 on DVDD18_MIPIRX, which carries the main
      (rear) camera.  1 selects the 1-lane CSI1 on DVDD18_MIPIIO, which
      carries the front camera.

      This property is not part of the shared mediatek,mt8365-csi-rx
      binding, so it is optional here: a node written against that binding
      still works and the driver programs the primary receiver (CSI0).
    enum: [0, 1]
    default: 0

  num-lanes:
    description:
      Number of MIPI data lanes the sensor uses.  CSI0 supports 1 to 4;
      CSI1 is fixed at 1.
    enum: [1, 2, 3, 4]
    default: 2

  phy-type:
    description:
      If the PHY doesn't support mode selection then this sets the
      operating mode.  See include/dt-bindings/phy/phy.h for constants.
      The MT6589 has no C-PHY, so only PHY_TYPE_DPHY (10) is valid.
    const: 10
    $ref: /schemas/types.yaml#/definitions/uint32

  '#phy-cells':
    description:
      If the PHY doesn't support mode selection then #phy-cells must be 0
      and the PHY mode is described using the phy-type property.
      If the PHY supports mode selection, then #phy-cells must be 1 and
      the mode is set in the PHY cells.  The only supported mode is
      PHY_TYPE_DPHY; see include/dt-bindings/phy/phy.h for constants.

      The MT6589 has no C-PHY, so #phy-cells = <0> with phy-type = <10> is
      the expected configuration.
    enum: [0, 1]

  power-domains:
    maxItems: 1

  resets:
    maxItems: 1

  reset-names:
    const: seninf

  # The D-PHY has a sink facing the sensor and a source facing the
  # CSI-2 receiver.
  ports:
    $ref: /schemas/graph/ports.yaml#

required:
  - compatible
  - reg
  - num-lanes
  - '#phy-cells'
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/phy/phy.h>
    {
        mipi_csi_phy0: mipi-csi-phy {
            compatible = "mediatek,mt6589-mipi-csi-dphy";
            reg = <0x0 0x15008000 0x0 0x900>;

            mediatek,mipi-csi-port = <0>;
            num-lanes = <2>;

            phy-type = <PHY_TYPE_DPHY>;
            #phy-cells = <0>;

            ports {
                csi2_phy0_in: port@0 {
                    csi2_phy0_in_ep: endpoint {
                        remote-endpoint = <&a5142_out_ep>;
                    };
                };

                csi2_phy0_out: port@1 {
                    csi2_phy0_out_ep: endpoint {
                        remote-endpoint = <&seninf_in_ep>;
                    };
                };
            };
        };
    };

...