%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/mediatek,mt6628-pwrseq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6628 combo-chip power sequence provider

maintainers:
  - Akari Tsuyukusa <akkun11.open@gmail.com>

description:
  The MT6628 WLAN/BT/FM/GNSS combo chip is attached to an MMC host over
  SDIO. This provider sequences its PMU_EN and active-low RESET inputs.
  The PMIC RTC provider is referenced because the chip requires the
  RTC_GPIO 32 kHz output to be enabled before power-up.

properties:
  compatible:
    const: mediatek,mt6628-pwrseq

  mediatek,rtc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Reference to the MediaTek PMIC RTC that supplies the 32 kHz output.

  pmu-gpios:
    maxItems: 1
    description: Active-high combo-chip PMU enable.

  reset-gpios:
    maxItems: 1
    description: Active-low combo-chip reset.

  pinctrl-names:
    items:
      - const: default

  pinctrl-0: true
  status: true

required:
  - compatible
  - mediatek,rtc
  - pmu-gpios
  - reset-gpios
  - pinctrl-names
  - pinctrl-0

additionalProperties: false
