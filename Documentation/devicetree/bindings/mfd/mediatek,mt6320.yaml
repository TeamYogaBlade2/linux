%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/mediatek,mt6320.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6320 PMIC

maintainers:
  - Akari Tsuyukusa <akkun11.open@gmail.com>

description: |
  MT6320 is a PMIC used in combination with MT6589 SoC.
  It is connected to host SoC by PWRAP interface.

properties:
  compatible:
    const: mediatek,mt6360

required:
  - compatible

additionalProperties:
  type: object

examples:
  - |
    &pwrap {
    	pmic: mt6320 {
    		compatible = "mediatek,mt6320";
    	};
    };
