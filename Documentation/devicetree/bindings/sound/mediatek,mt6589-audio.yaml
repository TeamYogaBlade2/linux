%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt6589-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6589 Audio Front End (AFE)

maintainers:
  - Akari Tsuyukusa <akkun11.open@gmail.com>

description: |
  The audio front end of the MT6589 hosts the memory interfaces (DL1
  playback, VUL capture), the interconnect that routes between them, the
  I2S input and output blocks, and the AFE<->PMIC serial link driven
  through the audsys syscon it is a child of.

  Note that there is no ADDA block on this part: no ADDA register is
  documented for the MT6589, and chapter 63's register map has nothing
  between AFE_MEMIF_MON4 (0x00e0) and AFE_FOC_CON (0x0170).  Sample-rate
  conversion for the PMIC link is done in the MT6320 codec, not here.

properties:
  compatible:
    enum:
      - mediatek,mt6589-audio

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: afe
      - const: i2s

  interrupts:
    maxItems: 1

  iram:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Genalloc-backed on-chip SRAM used for the AFE PCM DMA buffer.

required:
  - compatible
  - clocks
  - clock-names
  - iram
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt6589-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    afe_sram: sram@12008000 {
        compatible = "mmio-sram";
        reg = <0x12008000 0x4000>;
    };

    audsys: clock-controller@12070000 {
        compatible = "mediatek,mt6589-audsys", "syscon", "simple-mfd";
        reg = <0x12070000 0x1000>;
        #clock-cells = <1>;

        afe: audio-controller {
            compatible = "mediatek,mt6589-audio";
            clocks = <&audsys CLK_AUDIO_AFE>,
                     <&audsys CLK_AUDIO_I2S>;
            clock-names = "afe", "i2s";
            iram = <&afe_sram>;
            interrupts = <GIC_SPI 104 IRQ_TYPE_LEVEL_LOW>;
        };
    };
