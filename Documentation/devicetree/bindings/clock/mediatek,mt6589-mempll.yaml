%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6589-mempll.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6589 MEMPLL (DRAM PLL)

maintainers:
  - Akari Tsuyukusa <akkun11.open@gmail.com>

description: |
  The MT6589 MEMPLL is the PLL that clocks the DRAM controller.  Its
  registers are not in the apmixedsys window: MEMPLL0..MEMPLL12 and
  MEMPLL_DIVIDER live in the ddrphy_conf module at 0x1001_1600..0x1001_1640,
  and the power-on debounce registers MPLLPON0..3 at 0x1001_15C0, per the
  MT6589 datasheet section 13.4.3 ("DDRPHY Registers").  The node therefore
  lives in the ddrphy_conf window rather than under apmixedsys.

  The binding exposes the MEMPLL as a single read-only clock output.  The
  rate is declared by the board with "clock-frequency" rather than decoded
  from the registers, because the register set does not determine it
  unambiguously: MEMPLL0's feedback divider field is not the divider for
  PLL1, the reference can be either the crystal or the APLL plus a divider
  (MEMPLL1[12:11]), and the downstream frequency tables map several
  different DRAM rates onto the same DDS value.

  The MEMPLL selection for the DRAM clock is still made in topckgen, not
  here; the clock output of this node is what topckgen's "clkph_mck" is
  parented to.

properties:
  compatible:
    const: mediatek,mt6589-mempll

  reg:
    maxItems: 1
    description: |
      The ddrphy_conf window, at minimum covering the MEMPLL registers,
      i.e. 0x600 through 0x640 of that block.

  clock-frequency:
    description: |
      Frequency of the MEMPLL output in Hz, as configured by the bootloader
      for the DRAM rate this board runs at.  Defaults to 266500000, the
      figure the datasheet states for this clock ("MEMPLL_MCK 266.5MHz").
    minimum: 1

  "#clock-cells":
    const: 0

required:
  - compatible
  - reg
  - "#clock-cells"

allOf:
  - $ref: /schemas/clock/clock.yaml#

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt6589-clk.h>

    ddrphy: syscon@10011000 {
        compatible = "mediatek,mt6589-mempll";
        reg = <0x10011000 0x1000>;
        #clock-cells = <0>;
    };
